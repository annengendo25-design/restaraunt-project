<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDERS</title>
        <link rel="stylesheet" href="style.css">

</head>
<body>
     <nav>
        <a href="index.html">Home</a>
        
    </nav>
   
    <h1>Place Your Order 🛒</h1>

    <form>

    <h2>Customer Information</h2>

    <label for="name">Your Name:</label>
    <input type="text" id="name" name="name" required>

    <br><br>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone" required>

    <h2>Order Details</h2>

    <label for="food">Choose Your Food:</label>
    <select id="food" name="food" required>
        <option value="">-- Select an item --</option>
        <option value="Chicken Popcorns">Chicken Popcorns</option>
        <option value="Salmon & Avocado Salad">Salmon & Avocado Salad</option>
        <option value="Caesar Salad">Caesar Salad</option>
        <option value="T-Bone Steak">T-Bone Steak 500gr</option>
        <option value="Grilled Prawns">Grilled Prawns</option>
        <option value="Chicken & Noodles Soup">Chicken & Noodles Soup</option>
        <option value="Pancakes">Pancakes</option>
        <option value="Mini Cheese Burgers">Mini Cheese Burgers</option>
        <option value="Grilled Chicken Breast">Grilled Chicken Breast</option>
        <option value="Fish of the Day">Fish of the Day</option>
        <option value="Kwetu Full Breakfast">Kwetu Full Breakfast</option>
        <option value="Avocado & Peppers">Avocado & Peppers</option>
        <option value="Waffles">Waffles</option>
        <option value="Kwetu Asian Breakfast">Kwetu Asian Breakfast</option>
        <option value="Egg White Omelette">Egg White Omelette</option>
    </select>

    <br><br>

    <label for="drink">Choose a Drink:</label>
    <select id="drink" name="drink">
        <option value="">-- Select a drink --</option>
        <option value="Water">Water</option>
        <option value="Sodas">Sodas</option>
        <option value="Milkshakes">Milkshakes</option>
        <option value="Smoothies">Smoothies</option>
        <option value="Fresh Juices">Fresh Juices</option>
    </select>

    <br><br>

    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" name="quantity" min="1" value="1" required>

    <br><br>

    <label for="order-type">Order Type:</label>
    <select id="order-type" name="order-type">
        <option value="Dine-in">Dine-in</option>
        <option value="Takeaway">Takeaway</option>
    </select>

    <h2>Special Instructions</h2>

    <label for="message">Special Instructions:</label>
    <br>
    <textarea id="message" name="message" rows="4" cols="30"
        placeholder="Any special requests?"></textarea>

    <br><br>

    <button type="submit">Place Order 🛒</button>

</form>
</body>
</html>
